name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pocketcloud
          POSTGRES_PASSWORD: pocketcloud
          POSTGRES_DB: pocketcloud
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U pocketcloud -d pocketcloud"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://pocketcloud:pocketcloud@localhost:5432/pocketcloud?schema=public
      JWT_SECRET: ci-jwt-secret-that-is-at-least-32-chars-long
      REFRESH_TOKEN_SECRET: ci-refresh-secret-that-is-at-least-32-chars-long
      ENCRYPTION_KEY: ci-encryption-key-32-chars-minimum

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -w @pocketcloud/api

      - name: Build (TypeScript)
        run: npm run build

      - name: Run Prisma migrations
        run: npx prisma migrate deploy
        working-directory: apps/api

      - name: Run tests with coverage
        run: npm test -- --coverage

      - name: Security scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'  # Don't fail CI on unfixed vulns (just report)

  build-agent:
    name: Build Go Agent
    runs-on: ubuntu-latest
    needs: verify

    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-x86_64
          - goos: linux
            goarch: arm64
            suffix: linux-aarch64
          - goos: linux
            goarch: arm
            goarm: '7'
            suffix: linux-armv7l

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: agent/go.sum

      - name: Build agent binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm || '' }}
          CGO_ENABLED: '0'
        run: |
          cd agent
          go build -ldflags="-s -w -X main.agentVersion=$(git describe --tags --always 2>/dev/null || echo dev)" \
            -o "../dist/pocketcloud-agent-${{ matrix.suffix }}" \
            ./cmd/pocketcloud-agent

      - name: Upload agent binary
        uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.suffix }}
          path: dist/pocketcloud-agent-${{ matrix.suffix }}
          retention-days: 30

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [verify, build-agent]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all agent binaries
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
